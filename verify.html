<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대시보드 검증</title>
<style>
  html,body{margin:0;padding:0;background:#fff}
  #frame{border:0;display:block;background:#fff}
  #out{font:12px/1.5 monospace;white-space:pre-wrap;margin:6px;padding:10px;background:#101828;color:#d8e3ff;min-height:200px}
  .ok{color:#7ff0c0}.bad{color:#ff9aa8}
</style>
</head>
<body>
<iframe id="frame" title="dash"></iframe>
<pre id="out">starting...</pre>
<script>
(function(){
'use strict';
var Q = new URLSearchParams(location.search);
var W = parseInt(Q.get('w'), 10) || 1024;
var H = parseInt(Q.get('h'), 10) || 768;
var SCENE = Q.get('scene') || 'layout';
var frame = document.getElementById('frame');
var out = document.getElementById('out');
frame.width = W; frame.height = H;
frame.style.width = W + 'px'; frame.style.height = H + 'px';

var lines = [];
function log(s){ lines.push(s); out.textContent = lines.join('\n'); }
var fails = 0;
function assert(name, cond, extra){
  if (!cond) fails++;
  log((cond ? 'PASS ' : 'FAIL ') + name + (extra != null ? ' :: ' + extra : ''));
  return cond;
}
function finish(){
  log((fails ? '### RESULT: ' + fails + ' FAIL(S)' : '### RESULT: ALL PASS'));
  log('===DONE===');
  document.title = 'DONE-' + fails;
}
function seq(steps){
  var i = 0;
  function next(){
    if (i >= steps.length){ finish(); return; }
    var s = steps[i++];
    try { s(next); } catch(e){ log('EXCEPTION ' + (e && e.stack ? e.stack : e)); finish(); }
  }
  next();
}
function load(cb, qs){
  frame.onload = function(){
    setTimeout(function(){ cb(frame.contentWindow, frame.contentDocument); }, 500);
  };
  frame.src = 'index.html?_' + Date.now() + (qs || '');
}
/* storage seed: pairs = [[key, rawString], ...] */
function seeded(pairs, cb){
  frame.onload = function(){
    var ls = frame.contentWindow.localStorage;
    ls.clear();
    (pairs || []).forEach(function(p){ ls.setItem(p[0], p[1]); });
    frame.onload = function(){ setTimeout(function(){ cb(frame.contentWindow, frame.contentDocument); }, 550); };
    frame.src = 'index.html?run=' + Date.now();
  };
  frame.src = 'index.html?seed=' + Date.now();
}
function kstNowDate(){
  var n = new Date(Date.now() + 9 * 3600 * 1000);
  return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()));
}
function keyOff(off){
  var d = new Date(kstNowDate().getTime() + off * 86400000);
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
function md(key){ return Number(key.slice(5, 7)) + '/' + Number(key.slice(8, 10)); }

function metrics(w, d){
  var de = d.documentElement;
  var panel = d.getElementById('kidPanel');
  var list = d.getElementById('checklist');
  var top = d.querySelector('.topbar');
  var actions = d.querySelector('.tb-actions');
  return {
    viewport: w.innerWidth + 'x' + w.innerHeight,
    docScroll: de.scrollHeight, docClient: de.clientHeight,
    bodyScroll: d.body.scrollHeight,
    docOverflow: de.scrollHeight - de.clientHeight,
    panelScroll: panel ? panel.scrollHeight : null,
    panelClient: panel ? panel.clientHeight : null,
    panelOverflow: panel ? panel.scrollHeight - panel.clientHeight : null,
    listOverflow: list ? list.scrollHeight - list.clientHeight : null,
    topbarOverflow: top ? top.scrollWidth - top.clientWidth : null,
    actionsW: actions ? Math.round(actions.getBoundingClientRect().width) : null,
    pills: d.querySelectorAll('.tb-actions .pill').length,
    checks: d.querySelectorAll('.check-item').length,
    checkHeadOverflow: (function(){
      var h = d.querySelector('.check-head');
      return h ? h.scrollWidth - h.clientWidth : null;
    })()
  };
}

/* ---------------- scenes ---------------- */
if (SCENE === 'layout'){
  load(function(w, d){
    var m = metrics(w, d);
    log('size=' + W + 'x' + H + ' viewport=' + m.viewport);
    Object.keys(m).forEach(function(k){ log('  ' + k + '=' + m[k]); });
    assert('문서 스크롤 0 (' + W + 'x' + H + ')', m.docOverflow <= 0, 'overflow=' + m.docOverflow);
    assert('아이 패널 넘침 없음', m.panelOverflow <= 0, 'overflow=' + m.panelOverflow);
    assert('상단 바 한 줄', m.topbarOverflow <= 0, 'overflow=' + m.topbarOverflow);
    assert('체크 헤더 넘침 없음', m.checkHeadOverflow <= 0, 'overflow=' + m.checkHeadOverflow);
    assert('상단 버튼 4개(기록·소리·전체화면·설정)', m.pills === 4, 'pills=' + m.pills);
    /* 모달 크기 확인 */
    d.getElementById('histBtn').click();
    setTimeout(function(){
      var card = d.querySelector('.hist-card');
      var r = card.getBoundingClientRect();
      var modalOverflow = card.scrollHeight - card.clientHeight;
      log('  histModal card=' + Math.round(r.width) + 'x' + Math.round(r.height) + ' innerOverflow=' + modalOverflow);
      log('  calCells=' + d.querySelectorAll('.cal-cell').length + ' doneCells=' + d.querySelectorAll('.cal-cell.done').length);
      d.querySelector('[data-hview="stamp"]').click();
      setTimeout(function(){
        log('  stampSlots=' + d.querySelectorAll('.coupon .slot').length + ' onSlots=' + d.querySelectorAll('.coupon .slot.on').length);
        log('  stampsOverflow=' + (d.querySelector('.hist-card').scrollHeight - d.querySelector('.hist-card').clientHeight));
        d.getElementById('histCloseBtn').click();
        d.getElementById('setBtn').click();
        setTimeout(function(){
          var sc = d.querySelector('#modal .modal-card');
          log('  settingsModal=' + Math.round(sc.getBoundingClientRect().width) + 'x' + Math.round(sc.getBoundingClientRect().height) + ' overflow=' + (sc.scrollHeight - sc.clientHeight));
          log((fails ? '### RESULT: ' + fails + ' FAIL(S)' : '### RESULT: ALL PASS'));
          log('===DONE===');
          document.title = 'DONE-' + fails;
        }, 300);
      }, 300);
    }, 300);
  });
} else if (SCENE === 'flow'){
  var today = keyOff(0);
  function badgeText(d){ var b = d.querySelector('#stampBadge'); return b ? b.textContent : ''; }
  function approveBtn(d){ return d.querySelector('[data-act="approve"]'); }
  function stampsOf(w){
    try { return JSON.parse(w.localStorage.getItem('wdash.stamps.v1') || '{}').seoyun || { slots: [] }; }
    catch(e){ return { slots: [] }; }
  }
  function clickAll(d, n, cb){
    var i = 0;
    (function go(){
      if (i >= n){ cb(); return; }
      d.querySelectorAll('.check-item')[i].click();
      i++;
      setTimeout(go, 55);
    })();
  }
  seq([
    function(next){ seeded([], function(){ next(); }); },
    function(next){
      var d = frame.contentDocument;
      assert('기본 할 일 6개', d.querySelectorAll('.check-item').length === 6, d.querySelectorAll('.check-item').length);
      assert('도장 배지 0', /0/.test(badgeText(d)), badgeText(d));
      assert('배지 점 10개', d.querySelectorAll('#stampBadge .stamp-mini i').length === 10, d.querySelectorAll('#stampBadge .stamp-mini i').length);
      next();
    },
    function(next){
      var d = frame.contentDocument;
      clickAll(d, 6, function(){
        setTimeout(function(){
          assert('6개 모두 체크', d.getElementById('checkCount').textContent === '6/6', d.getElementById('checkCount').textContent);
          assert('자동 발급 안 됨', stampsOf(frame.contentWindow).slots.length === 0, JSON.stringify(stampsOf(frame.contentWindow).slots));
          assert('배지 확인 대기', /확인 대기/.test(badgeText(d)), badgeText(d));
          assert('꼬리말 확인 안내', /확인/.test(d.getElementById('footText').textContent), d.getElementById('footText').textContent);
          next();
        }, 250);
      });
    },
    function(next){
      var d = frame.contentDocument;
      d.getElementById('histBtn').click();
      setTimeout(function(){
        var body = d.getElementById('histBody').textContent.replace(/\s+/g, ' ');
        assert('기록 모달 열림', d.getElementById('histModal').hidden === false);
        assert('이번 주 1회', /이번 주\s*1회/.test(body), body.slice(0, 80));
        assert('연속 1일', /연속 성공\s*1일/.test(body), body.slice(0, 80));
        assert('달력 오늘 완료', d.querySelectorAll('.cal-cell.done').length === 1, d.querySelectorAll('.cal-cell.done').length);
        d.querySelector('[data-hview="stamp"]').click();
        setTimeout(function(){
          assert('도장판 슬롯 10칸', d.querySelectorAll('.coupon .slot').length === 10, d.querySelectorAll('.coupon .slot').length);
          assert('찍힌 도장 0', d.querySelectorAll('.coupon .slot.on').length === 0, d.querySelectorAll('.coupon .slot.on').length);
          assert('확인 대기 안내', /다 채웠어요/.test(d.getElementById('histBody').textContent));
          var btn = approveBtn(d);
          assert('도장 찍어주기 버튼', !!btn && /도장 찍어주기/.test(btn.textContent), btn ? btn.textContent : 'none');
          btn.click();
          setTimeout(next, 250);
        }, 250);
      }, 250);
    },
    function(next){
      var d = frame.contentDocument, w = frame.contentWindow;
      var st = stampsOf(w);
      assert('부모 확인 후 1칸 발급', st.slots.length === 1 && st.slots[0].date === today, JSON.stringify(st.slots));
      assert('발급 완료 배너', /도장 발급 완료/.test(d.getElementById('histBody').textContent), d.getElementById('histBody').textContent.replace(/\s+/g, ' ').slice(0, 100));
      assert('발급 후 버튼 사라짐', !approveBtn(d));
      assert('배지 도장 완료', /도장 완료/.test(badgeText(d)), badgeText(d));
      d.getElementById('histCloseBtn').click();
      setTimeout(function(){
        d.querySelectorAll('.check-item')[2].click();
        setTimeout(function(){
          assert('체크 풀어도 도장 유지', stampsOf(w).slots.length === 1, JSON.stringify(stampsOf(w).slots));
          assert('배지 점 1개', d.querySelectorAll('#stampBadge .stamp-mini i.on').length === 1, d.querySelectorAll('#stampBadge .stamp-mini i.on').length);
          d.querySelectorAll('.check-item')[2].click();
          setTimeout(function(){
            assert('재체크 중복 없음', stampsOf(w).slots.length === 1, JSON.stringify(stampsOf(w).slots));
            assert('재체크 후 도장 완료 표시', /도장 완료/.test(badgeText(d)), badgeText(d));
            next();
          }, 200);
        }, 200);
      }, 200);
    },
    function(next){
      /* 설정: 추가·삭제 */
      var d = frame.contentDocument;
      d.getElementById('setBtn').click();
      setTimeout(function(){
        assert('설정 할 일 6칸', d.querySelectorAll('#setTasks input').length === 6, d.querySelectorAll('#setTasks input').length);
        d.getElementById('addTaskBtn').click();
        d.getElementById('addTaskBtn').click();
        setTimeout(function(){
          assert('추가 후 8칸', d.querySelectorAll('#setTasks input').length === 8, d.querySelectorAll('#setTasks input').length);
          d.querySelector('#setTask6').value = '저녁 설거지 돕기';
          d.querySelector('#setTask7').value = '내일 가방 미리 싸기';
          d.getElementById('saveBtn').click();
          setTimeout(function(){
            assert('저장 후 8개', d.querySelectorAll('.check-item').length === 8, d.querySelectorAll('.check-item').length);
            assert('추가 항목 미체크(6/8)', d.getElementById('checkCount').textContent === '6/8', d.getElementById('checkCount').textContent);
            var st = JSON.parse(frame.contentWindow.localStorage.getItem('wdash.settings.v2') || '{}');
            assert('설정 8개 저장', st.seoyun && st.seoyun.tasks.length === 8 && st.seoyun.tasks[7] === '내일 가방 미리 싸기', JSON.stringify(st.seoyun && st.seoyun.tasks));
            next();
          }, 250);
        }, 200);
      }, 250);
    },
    function(next){
      var d = frame.contentDocument;
      d.getElementById('setBtn').click();
      setTimeout(function(){
        var dels = d.querySelectorAll('#setTasks .task-del');
        assert('삭제 버튼 8개', dels.length === 8, dels.length);
        dels[7].click();
        setTimeout(function(){
          assert('삭제 후 입력 7칸', d.querySelectorAll('#setTasks input').length === 7, d.querySelectorAll('#setTasks input').length);
          d.getElementById('saveBtn').click();
          setTimeout(function(){
            assert('저장 후 7개', d.querySelectorAll('.check-item').length === 7, d.querySelectorAll('.check-item').length);
            assert('삭제 후 6/7', d.getElementById('checkCount').textContent === '6/7', d.getElementById('checkCount').textContent);
            next();
          }, 200);
        }, 200);
      }, 250);
    },
    function(next){
      var d = frame.contentDocument;
      d.getElementById('setBtn').click();
      setTimeout(function(){
        d.querySelector('#setTasks .task-del[data-del="1"]').click();
        setTimeout(function(){
          d.getElementById('saveBtn').click();
          setTimeout(function(){
            var txt = Array.prototype.map.call(d.querySelectorAll('.check-item .txt'), function(e){ return e.textContent; });
            log('  tasks=' + txt.join(' | '));
            assert('가운데 삭제 후 6개', d.querySelectorAll('.check-item').length === 6, d.querySelectorAll('.check-item').length);
            assert('삭제 항목 빠짐', txt.indexOf('아침밥 먹기') < 0, txt.join(','));
            next();
          }, 200);
        }, 200);
      }, 250);
    },
    function(next){
      var d = frame.contentDocument;
      d.getElementById('setBtn').click();
      setTimeout(function(){
        d.getElementById('resetBtn').click();
        setTimeout(function(){
          d.getElementById('saveBtn').click();
          setTimeout(function(){
            assert('기본값 복원 6개', d.querySelectorAll('.check-item').length === 6, d.querySelectorAll('.check-item').length);
            next();
          }, 200);
        }, 200);
      }, 250);
    },
    function(next){
      /* 시트 URL + 페이로드(todayStamped) */
      seeded([['wdash.sheetUrl.v1', 'https://script.google.com/macros/s/TEST_TOKEN/exec']], function(w, d){
        var calls = [];
        w.fetch = function(url, opts){ calls.push({ url: url, opts: opts || {} }); return Promise.resolve({ ok: true }); };
        assert('시트 URL 입력칸 있음', !!d.getElementById('setSheetUrl'));
        d.querySelectorAll('.check-item')[0].click();
        setTimeout(function(){
          assert('시트로 POST 1건', calls.length === 1, calls.length);
          if (calls.length){
            var o = calls[0].opts;
            assert('POST·no-cors', o.method === 'POST' && o.mode === 'no-cors', o.method + '/' + o.mode);
            var body = {};
            try { body = JSON.parse(o.body); } catch(e){}
            log('  payload=' + JSON.stringify(body));
            assert('payload 필드', body.date === today && body.kidId === 'seoyun' && body.kidName === '서윤'
              && typeof body.done === 'number' && typeof body.total === 'number'
              && typeof body.allDone === 'boolean' && typeof body.stampsCount === 'number'
              && typeof body.completedBoards === 'number' && body.todayStamped === false
              && !!body.updatedAt, JSON.stringify(body));
          }
          next();
        }, 250);
      });
    },
    function(next){
      /* 부모 비밀번호 4자리: 틀린 번호 → 맞는 번호 */
      seeded([
        ['wdash.pin.v1', '1234'],
        ['wdash.sheetUrl.v1', 'https://script.google.com/macros/s/TEST_TOKEN/exec'],
        ['wdash.checks.v2', JSON.stringify({ date: today, data: {
          seoyun: [true, true, true, true, true, true],
          chaeyun: [false, false, false, false, false, false],
          seungyun: [false, false, false, false, false, false]
        } })]
      ], function(w, d){
        var calls = [];
        w.fetch = function(url, opts){ calls.push({ url: url, opts: opts || {} }); return Promise.resolve({}); };
        assert('PIN 있으면 확인 대기', /확인 대기/.test(badgeText(d)), badgeText(d));
        d.getElementById('histBtn').click();
        setTimeout(function(){
          d.querySelector('[data-hview="stamp"]').click();
          setTimeout(function(){
            approveBtn(d).click();
            setTimeout(function(){
              assert('PIN 창 열림', d.getElementById('pinModal').hidden === false);
              ['9', '9', '9', '9'].forEach(function(n){ d.querySelector('.pin-key[data-pin="' + n + '"]').click(); });
              setTimeout(function(){
                assert('틀린 PIN 거부', stampsOf(w).slots.length === 0 && d.getElementById('pinModal').hidden === false, JSON.stringify(stampsOf(w).slots));
                assert('틀린 PIN 안내', /맞지 않아요/.test(d.getElementById('pinMsg').textContent), d.getElementById('pinMsg').textContent);
                ['1', '2', '3', '4'].forEach(function(n){ d.querySelector('.pin-key[data-pin="' + n + '"]').click(); });
                setTimeout(function(){
                  assert('맞는 PIN 통과', stampsOf(w).slots.length === 1, JSON.stringify(stampsOf(w).slots));
                  assert('PIN 창 닫힘', d.getElementById('pinModal').hidden === true);
                  var body = {};
                  try { body = JSON.parse(calls[calls.length - 1].opts.body); } catch(e){}
                  assert('payload todayStamped=true', body.todayStamped === true, JSON.stringify(body));
                  d.getElementById('histCloseBtn').click();
                  setTimeout(next, 200);
                }, 300);
              }, 250);
            }, 250);
          }, 250);
        }, 250);
      });
    },
    function(next){
      /* 설정 저장도 PIN 확인 */
      var d = frame.contentDocument;
      d.getElementById('setBtn').click();
      setTimeout(function(){
        d.getElementById('saveBtn').click();
        setTimeout(function(){
          assert('설정 저장에 PIN 요구', d.getElementById('pinModal').hidden === false, d.getElementById('pinModal').hidden);
          d.querySelector('.pin-key[data-pin="cancel"]').click();
          setTimeout(function(){
            assert('PIN 취소 시 설정 유지', d.getElementById('modal').hidden === false && d.getElementById('pinModal').hidden === true);
            d.getElementById('cancelBtn').click();
            next();
          }, 200);
        }, 300);
      }, 250);
    }
  ]);
} else if (SCENE === 'board'){
  var today2 = keyOff(0);
  var slots9 = [];
  var hist = {};
  for (var i = 9; i >= 1; i--){
    var k = keyOff(-i);
    slots9.push({ date: k });
    hist[k] = { seoyun: { done: 6, total: 6, allDone: true, tasks: [true, true, true, true, true, true] } };
  }
  var stampSeed = { seoyun: { slots: slots9, completedBoards: 0 } };
  var checksSeed = { date: today2, data: {
    seoyun: [true, true, true, true, true, true],
    chaeyun: [false, false, false, false, false, false],
    seungyun: [false, false, false, false, false, false]
  } };
  seq([
    function(next){
      seeded([
        ['wdash.stamps.v1', JSON.stringify(stampSeed)],
        ['wdash.history.v1', JSON.stringify(hist)],
        ['wdash.checks.v2', JSON.stringify(checksSeed)]
      ], function(){ next(); });
    },
    function(next){
      var w = frame.contentWindow, d = frame.contentDocument;
      var st = JSON.parse(w.localStorage.getItem('wdash.stamps.v1') || '{}');
      assert('자동으로 10칸이 되지 않음', ((st.seoyun || {}).slots || []).length === 9, JSON.stringify((st.seoyun || {}).slots));
      assert('배지 확인 대기', /확인 대기/.test(d.querySelector('#stampBadge').textContent), d.querySelector('#stampBadge').textContent);
      d.getElementById('histBtn').click();
      setTimeout(function(){
        d.querySelector('[data-hview="stamp"]').click();
        setTimeout(function(){
          assert('9칸 찍힘', d.querySelectorAll('.coupon .slot.on').length === 9, d.querySelectorAll('.coupon .slot.on').length);
          d.querySelector('[data-act="approve"]').click();
          setTimeout(function(){
            var st2 = JSON.parse(w.localStorage.getItem('wdash.stamps.v1') || '{}');
            assert('부모 확인으로 10칸', ((st2.seoyun || {}).slots || []).length === 10, JSON.stringify((st2.seoyun || {}).slots));
            assert('10칸 완성 축하', /도장 10개 완성/.test(d.getElementById('histBody').textContent));
            var btn = d.querySelector('[data-act="newboard"]');
            assert('새 도장판 버튼', !!btn, btn ? btn.textContent : 'none');
            btn.click();
            setTimeout(function(){
              var st3 = JSON.parse(w.localStorage.getItem('wdash.stamps.v1') || '{}');
              var s3 = st3.seoyun || {};
              assert('새 판 0칸', (s3.slots || []).length === 0, JSON.stringify(s3.slots));
              assert('완성한 판 1판', s3.completedBoards === 1, s3.completedBoards);
              assert('배지 0/10', /0/.test(d.querySelector('#stampBadge').textContent), d.querySelector('#stampBadge').textContent);
              assert('새 판에서 확인 대기', /확인 대기/.test(d.querySelector('#stampBadge').textContent), d.querySelector('#stampBadge').textContent);
              d.getElementById('histCloseBtn').click();
              setTimeout(next, 200);
            }, 300);
          }, 300);
        }, 300);
      }, 300);
    },
    function(next){
      /* 오늘 다시 승인 → 새 판 첫 칸. 같은 날 두 번은 불가 */
      var d = frame.contentDocument, w = frame.contentWindow;
      d.getElementById('histBtn').click();
      setTimeout(function(){
        d.querySelector('[data-hview="stamp"]').click();
        setTimeout(function(){
          var b1 = d.querySelector('[data-act="approve"]');
          assert('새 판에서 승인 버튼', !!b1);
          if (b1) b1.click();
          setTimeout(function(){
            var st = JSON.parse(w.localStorage.getItem('wdash.stamps.v1') || '{}');
            assert('새 판에 1칸', ((st.seoyun || {}).slots || []).length === 1, JSON.stringify((st.seoyun || {}).slots));
            assert('같은 날 재승인 불가', !d.querySelector('[data-act="approve"]'));
            var body = d.getElementById('histBody').textContent.replace(/\s+/g, ' ');
            assert('연속 성공 10일', /연속 성공\s*10일/.test(body), body.slice(0, 120));
            d.querySelector('[data-hview="history"]').click();
            setTimeout(function(){
              var h = d.getElementById('histBody').textContent.replace(/\s+/g, ' ');
              assert('이번 달 10회', /이번 달\s*10회/.test(h), h.slice(0, 120));
              next();
            }, 250);
          }, 300);
        }, 300);
      }, 300);
    }
  ]);
} else if (SCENE === 'demo' || SCENE === 'demoset'){
  var view = Q.get('view') || '';
  var t6 = [true, true, true, true, true, true];
  var histD = {};
  var slotsD = [];
  for (var di = 21; di >= 1; di--){
    var kk = keyOff(-di);
    var all = (di <= 3) ? true : (di % 5 !== 0);
    histD[kk] = { seoyun: { done: all ? 6 : 4, total: 6, allDone: all, tasks: t6 } };
    if (di <= 3) slotsD.push({ date: kk });
  }
  /* 오늘은 4/6 (도장 없음) */
  histD[keyOff(0)] = { seoyun: { done: 4, total: 6, allDone: false, tasks: [true, true, true, true, false, false] } };
  if (view === 'full'){
    slotsD = [];
    histD = {};
    for (var fi = 10; fi >= 1; fi--){
      var fk = keyOff(-fi);
      slotsD.push({ date: fk });
      histD[fk] = { seoyun: { done: 6, total: 6, allDone: true, tasks: t6 } };
    }
    slotsD.push({ date: keyOff(0) });
  }
  var stampSeed2 = {
    seoyun: { slots: slotsD, completedBoards: 2 },
    chaeyun: { slots: [keyOff(-1), keyOff(-2), keyOff(-4), keyOff(-5), keyOff(-7), keyOff(-8), keyOff(-9)].map(function(x){ return { date: x }; }), completedBoards: 0 },
    seungyun: { slots: [{ date: keyOff(-2) }, { date: keyOff(-6) }], completedBoards: 1 }
  };
  var checksSeed2 = { date: keyOff(0), data: {
    seoyun: (view === 'full' || view === 'wait') ? [true, true, true, true, true, true] : [true, true, true, true, false, false],
    chaeyun: [true, true, true, true, true, true],
    seungyun: [true, true, true, true, true, false]
  } };
  var settingsSeed2 = null;
  if (SCENE === 'demoset'){
    var t12 = ['이불 정리하기', '아침밥 먹기', '세수·양치하기', '시간표 보고 숙제·책·준비물 챙기기',
      '물병·우산 챙기기', '책상이랑 방 정리하기', '저녁 설거지 돕기', '내일 가방 미리 싸기',
      '저녁 숙제 마무리', '욕실 정리하기', '내일 옷 미리 꺼내기', '가족에게 인사하기'];
    if (Q.get('tasks') === '12'){
      settingsSeed2 = JSON.stringify({ seoyun: { time: '07:50', tasks: t12 } });
    } else {
      settingsSeed2 = JSON.stringify({ seoyun: { time: '07:50', tasks: t12.slice(0, 8) } });
    }
  }
  var pairs = [
    ['wdash.stamps.v1', JSON.stringify(stampSeed2)],
    ['wdash.history.v1', JSON.stringify(histD)],
    ['wdash.checks.v2', JSON.stringify(checksSeed2)]
  ];
  if (settingsSeed2) pairs.push(['wdash.settings.v2', settingsSeed2]);
  seeded(pairs, function(w, d){
    if (SCENE === 'demoset'){
      d.getElementById('setBtn').click();
    } else if (view === 'hist'){
      d.getElementById('histBtn').click();
    } else if (view === 'stamp' || view === 'full' || view === 'wait'){
      d.getElementById('histBtn').click();
      setTimeout(function(){ d.querySelector('[data-hview="stamp"]').click(); }, 250);
    }
    setTimeout(function(){
      var m = metrics(w, d);
      log('demo ' + W + 'x' + H + ' view=' + (view || SCENE) + ' docOverflow=' + m.docOverflow + ' panelOverflow=' + m.panelOverflow);
      log('  badge=' + (d.querySelector('#stampBadge') ? d.querySelector('#stampBadge').textContent : '-'));
      log('===DONE===');
      document.title = 'DONE';
    }, 700);
  });
} else if (SCENE === 'shot'){
  load(function(w, d){
    var m = metrics(w, d);
    log('shot ' + W + 'x' + H + ' docOverflow=' + m.docOverflow + ' panelOverflow=' + m.panelOverflow);
    log('===DONE===');
    document.title = 'DONE';
  });
}
})();
</script>
</body>
</html>
