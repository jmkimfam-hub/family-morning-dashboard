<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>phrase fit</title>
<style>body{margin:0;font-family:monospace;background:#111;color:#eee;font-size:12px}
#f{position:fixed;left:-4000px;top:0;width:1024px;height:768px;border:0}
#m{position:absolute;left:-4000px;top:0;visibility:hidden}
#out{white-space:pre-wrap;padding:8px;line-height:1.4}</style></head><body>
<div id="m"></div><pre id="out">loading</pre>
<iframe id="f" src="candidate.html?v=40"></iframe>
<script>
var PHRASES = ["내가 할 수 있다고 믿고 시작하면 이미 절반은 해낸 거예요", "나는 생각보다 더 강하고 씩씩한 사람이에요", "나만의 속도로 자라고 있으니 조급해하지 않아도 돼요", "내 안에는 아직 꺼내지 않은 재능이 많이 숨어 있어요", "오늘의 나를 칭찬해 주면 내일의 나도 힘이 나요", "나는 소중한 사람이고 사랑받을 자격이 충분해요", "실수해도 내 가치는 조금도 줄어들지 않아요", "나는 스스로 결정하고 책임질 수 있는 사람이에요", "다른 사람과 다르다는 건 나만의 장점이에요", "내 마음을 솔직하게 말하는 것도 용기예요", "작은 노력이 매일 쌓이면 못 해낼 일은 없어요", "하루에 하나씩만 해도 일 년이면 365개를 해내요", "잘하는 사람도 처음에는 모두 서툴렀어요", "안 되면 방법을 바꿔서 다시 해보면 돼요", "포기하고 싶을 때 한 번만 더 해보는 게 진짜 실력이에요", "오늘 10분의 노력이 내일의 나를 바꿔요", "천천히 가도 멈추지 않으면 반드시 도착해요", "어려운 문제일수록 풀었을 때 더 크게 성장해요", "연습은 나를 속이지 않아요. 한 만큼 남아요", "계획을 세우고 하나씩 해내는 습관이 나를 강하게 만들어요", "끝까지 해본 경험이 쌓이면 자신감이 생겨요", "지금 하는 노력은 눈에 안 보여도 쌓이고 있어요", "오늘 해야 할 일을 미루지 않는 것이 최고의 습관이에요", "잘못했을 때 고치면 그게 바로 성장이에요", "할 수 있는 일부터 하나씩 하면 어려운 일도 풀려요", "꾸준함은 재능을 이기는 가장 강한 힘이에요", "한 번 더 읽고 한 번 더 써보면 기억에 남아요", "남보다 빨리 가는 것보다 끝까지 가는 게 중요해요", "오늘도 건강한 아침을 맞이할 수 있어 감사해요", "맛있는 밥을 차려 주시는 가족에게 고맙다고 말해 봐요", "고맙다는 말 한마디가 나도 주변 사람도 행복하게 만들어요", "당연하다고 생각했던 것 하나에 감사해 보세요", "나를 도와준 친구에게 먼저 고맙다고 인사해 봐요", "물 한 잔 따뜻한 방 함께 있는 가족이 모두 소중한 선물이에요", "감사한 일을 세 가지 적으면 마음이 더 환해져요", "선생님과 부모님의 수고를 기억하면 마음이 따뜻해져요", "친구의 좋은 점을 찾아 칭찬해 주면 사이가 더 좋아져요", "오늘 하루 있었던 좋은 일을 하나씩 기억해 봐요", "실수는 실패가 아니라 내가 더 잘하게 되는 연습이에요", "남과 비교하지 말고 어제의 나보다 한 걸음만 더 나아가요", "못하는 게 아니라 아직 배우는 중일 뿐이에요", "마음먹은 일은 말로 하지 말고 행동으로 보여줘요", "웃으면 마음이 가벼워지고 힘이 생겨요", "힘들 때 잠깐 쉬는 것도 다시 잘하기 위한 준비예요", "걱정이 생기면 할 수 있는 일부터 찾아보면 돼요", "오늘의 작은 용기가 내일의 큰 변화를 만들어요", "좋아하는 일에 최선을 다하면 그것이 나의 힘이 돼요", "다른 사람의 성공을 함께 기뻐하면 나도 더 행복해져요", "안 좋은 일이 있어도 괜찮아요. 내일은 새로 시작할 수 있어요", "내가 한 약속을 꼭 지키면 믿음이 쌓여요", "질문하는 건 부끄러운 게 아니라 똑똑해지는 방법이에요", "지금이 어려워도 그 과정이 나를 더 단단하게 만들어요", "오늘 하루 최선을 다한 나에게 박수를 보내요", "모르는 것도 하나씩 알아가면 어느샌가 전문가가 돼요", "나를 위해 쓴 시간은 반드시 나를 도와줘요", "기분이 안 좋아도 좋은 쪽으로 생각해 보는 연습을 해요", "어려운 일을 끝낸 경험은 다음 도전의 자신감이 돼요", "함께 하면 혼자서 못 하는 일도 해낼 수 있어요", "오늘도 나는 어제보다 조금 더 성장하고 있어요", "매일 한 장씩 책을 읽으면 일 년 뒤 큰 지식이 돼요", "안 된다고 말하기 전에 한 번만 해보고 판단해요", "시간을 아껴 쓰면 하고 싶은 일을 더 많이 할 수 있어요", "준비한 사람에게 기회가 와요. 오늘 미리 준비해 봐요", "내가 가진 것에 감사하면 마음이 든든해져요", "친구의 말을 끝까지 들어주면 좋은 친구가 돼요", "어른이 되어서도 기억할 좋은 습관을 지금 만들어 봐요", "하루의 시작을 좋게 만들면 하루 전체가 좋아져요", "나에게 주어진 오늘을 소중히 쓰면 그것이 최고의 선물이에요"];
document.getElementById('f').onload = function(){
  setTimeout(function(){
    var d = document.getElementById('f').contentDocument;
    var el = d.getElementById('phraseText');
    var cs = d.defaultView.getComputedStyle(el);
    var box = document.getElementById('m');
    var s = 'font-size:'+cs.fontSize+';line-height:'+cs.lineHeight+';font-family:'+cs.fontFamily+
            ';font-weight:'+cs.fontWeight+';letter-spacing:'+cs.letterSpacing+';word-break:keep-all;';
    box.style.cssText = 'position:absolute;left:-4000px;visibility:hidden;width:'+el.clientWidth+'px;'+s;
    var res = { w: el.clientWidth, availH: el.clientHeight, cardH: Math.round(d.querySelector('#phraseCard').getBoundingClientRect().height), max: 0, worst: '' };
    PHRASES.forEach(function(p){
      box.textContent = '\u201C' + p + '\u201D';
      var h = box.offsetHeight;
      if (h > res.max){ res.max = h; res.worst = p; }
      box.textContent = p;
      var h2 = box.offsetHeight;
      if (h2 > res.max){ res.max = h2; res.worst = p; }
    });
    res.fits = res.max <= res.availH;
    document.getElementById('out').textContent = 'RESULT:' + JSON.stringify(res, null, 1);
    document.title = 'PHRASE_FIT_READY';
  }, 1200);
};
</script></body></html>
