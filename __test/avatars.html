<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>avatar preview</title>
<style>
  body{margin:0;background:#fbf7ff;font-family:"Malgun Gothic",sans-serif}
  #grid{display:flex;flex-wrap:wrap;padding:16px}
  .cell{width:220px;margin:0 14px 14px 0;text-align:center}
  .big{width:180px;height:180px;border-radius:50%;overflow:hidden;margin:0 auto;box-shadow:0 8px 24px rgba(120,130,180,.18)}
  .big svg{width:180px;height:180px;display:block}
  .mid{width:88px;height:88px;border-radius:50%;overflow:hidden;margin:10px auto 0}
  .mid svg{width:88px;height:88px;display:block}
  .sm{width:40px;height:40px;border-radius:50%;overflow:hidden;margin:10px auto 0}
  .sm svg{width:40px;height:40px;display:block}
  .t{font-weight:800;color:#3a4463;margin-top:8px;font-size:13px}
</style></head>
<body>
<iframe id="f" src="candidate.html?v=41" style="position:fixed;left:-4000px;top:0;width:1024px;height:768px;border:0"></iframe>
<div id="grid"></div>
<script>
document.getElementById('f').onload = function(){
  setTimeout(function(){
    var d = document.getElementById('f').contentDocument;
    var tabs = [].slice.call(d.querySelectorAll('.tab'));
    var grid = document.getElementById('grid');
    tabs.forEach(function(t){
      var svg = t.querySelector('.tab-avatar svg');
      var name = t.querySelector('.tab-name') ? t.querySelector('.tab-name').textContent.trim() : '';
      var cell = document.createElement('div'); cell.className = 'cell';
      [['big',180],['mid',88],['sm',40]].forEach(function(s){
        var w = document.createElement('div'); w.className = s[0];
        var c = svg.cloneNode(true); c.setAttribute('width', s[1]); c.setAttribute('height', s[1]);
        w.appendChild(c); cell.appendChild(w);
      });
      var lab = document.createElement('div'); lab.className = 't'; lab.textContent = name;
      cell.appendChild(lab); grid.appendChild(cell);
    });
    var psvg = d.querySelector('.kid-avatar svg');
    if (psvg){
      var cell = document.createElement('div'); cell.className='cell';
      var w = document.createElement('div'); w.className='mid';
      var c = psvg.cloneNode(true); c.setAttribute('width',88); c.setAttribute('height',88);
      w.appendChild(c); cell.appendChild(w);
      var lab = document.createElement('div'); lab.className='t'; lab.textContent='패널 헤더 아바타';
      cell.appendChild(lab); grid.appendChild(cell);
    }
    document.title = 'AVATARS_READY';
  }, 1200);
};
</script>
</body></html>
