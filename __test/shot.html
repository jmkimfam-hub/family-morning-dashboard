<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}iframe{border:0;display:block}</style></head>
<body>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var w = Number(p.get('w') || 1024), h = Number(p.get('h') || 768);
  var src = p.get('src') || 'candidate.html';
  var f = document.createElement('iframe');
  f.setAttribute('width', w); f.setAttribute('height', h);
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.src = src;
  document.body.appendChild(f);
})();
</script>
</body></html>
